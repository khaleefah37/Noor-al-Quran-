publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
  assets:
    - assets/data/quran.json
    sdk: flutter
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  dio: ^5.7.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
